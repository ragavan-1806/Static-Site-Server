<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Static Site | AWS S3 Hosted</title>
    <style>
        /* Base Reset & Styling */
        * {
            margin: 0;
            padding: 0;
            box-gradient: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* Card Container */
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        /* Elements */
        h1 {
            color: #232f3e; /* AWS Dark Blue */
            margin-bottom: 15px;
            font-size: 2.2rem;
        }

        .badge {
            background-color: #ff9900; /* AWS Orange */
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background-color: #232f3e;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background-color: #141b24;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">Live on AWS S3</div>
        <h1>Static Site Server</h1>
        <p>Success! Your static webpage is successfully configured, deployed, and served globally using Amazon Simple Storage Service (S3).</p>
        <a href="#" class="btn">Project Completed</a>
    </div>

</body>
</html>
